<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>직원 연차 현황 | LeaveERP</title>
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/overlayscrollbars@2.16.0/styles/overlayscrollbars.min.css">
  <link rel="stylesheet" href="styles/common.css">
</head>
<body>
<aside class="sidebar" id="sidebar"></aside>

<div class="main-content">
  <header class="topbar">
    <div class="topbar-left">
      <span class="topbar-title">직원 연차 현황</span>
    </div>
    <div class="topbar-actions">
      <button class="icon-btn" title="내보내기" aria-label="내보내기">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      </button>
    </div>
  </header>

  <main class="page-content">
    <div class="page-header">
      <div>
        <h1 class="page-title">직원 연차 현황</h1>
        <p class="page-subtitle">2026년 직원별 연차 부여·사용·잔여 현황</p>
      </div>
    </div>

    <div class="filter-bar">
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="searchInput" placeholder="이름 또는 부서 검색..." aria-label="직원 검색">
      </div>
      <select class="filter-select" id="deptFilter" aria-label="부서 필터">
        <option value="">전체 부서</option>
        <option value="개발팀">개발팀</option>
        <option value="마케팅팀">마케팅팀</option>
        <option value="영업팀">영업팀</option>
        <option value="인사팀">인사팀</option>
        <option value="기획팀">기획팀</option>
      </select>
      <select class="filter-select" id="statusFilter" aria-label="소진율 필터">
        <option value="">전체</option>
        <option value="high">소진율 70% 이상</option>
        <option value="low">잔여 3일 이하</option>
      </select>
    </div>

    <div class="card section">
      <div class="card-body">
        <div class="table-wrapper">
          <table id="employeeTable">
            <thead style="border-top: var(--border-default);">
              <tr>
                <th>직원</th>
                <th>부서</th>
                <th>직급</th>
                <th>입사일</th>
                <th>총 연차</th>
                <th>사용</th>
                <th>잔여</th>
                <th>소진율</th>
                <th>상세</th>
              </tr>
            </thead>
            <tbody id="employeeBody">
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- 직원 상세 모달 -->
<div class="modal-overlay" id="detailModal">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="modalName">직원 연차 상세</span>
      <button class="modal-close" onclick="closeModal('detailModal')" aria-label="닫기">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="stat-row"><span class="stat-row-label">이름</span><span class="stat-row-value" id="mName">—</span></div>
      <div class="stat-row"><span class="stat-row-label">부서 / 직급</span><span class="stat-row-value" id="mDept">—</span></div>
      <div class="stat-row"><span class="stat-row-label">입사일</span><span class="stat-row-value" id="mJoin">—</span></div>
      <div class="stat-row"><span class="stat-row-label">총 연차</span><span class="stat-row-value" id="mTotal">—</span></div>
      <div class="stat-row"><span class="stat-row-label">사용 연차</span><span class="stat-row-value" id="mUsed">—</span></div>
      <div class="stat-row"><span class="stat-row-label">잔여 연차</span><span class="stat-row-value" id="mRemain">—</span></div>
      <div class="stat-row"><span class="stat-row-label">소진율</span><span class="stat-row-value" id="mRate">—</span></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('detailModal')">닫기</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/overlayscrollbars@2.16.0/browser/overlayscrollbars.browser.es5.min.js"></script>
<script src="js/utils.js"></script>
<script src="js/layout.js"></script>
<script>
  initLayout('employees.html');

  const employees = [
    { name:'김민준', dept:'개발팀',   rank:'선임', join:'2021.03.02', total:15, used:8,  rate:53 },
    { name:'이서연', dept:'마케팅팀', rank:'주임', join:'2023.01.09', total:15, used:12, rate:80 },
    { name:'박도윤', dept:'영업팀',   rank:'대리', join:'2022.06.15', total:15, used:5,  rate:33 },
    { name:'최수아', dept:'인사팀',   rank:'과장', join:'2019.09.01', total:20, used:15, rate:75 },
    { name:'정하은', dept:'기획팀',   rank:'사원', join:'2025.03.04', total:11, used:3,  rate:27 },
    { name:'한준서', dept:'개발팀',   rank:'주임', join:'2022.11.07', total:15, used:11, rate:73 },
    { name:'오지민', dept:'마케팅팀', rank:'대리', join:'2021.07.19', total:15, used:7,  rate:47 },
    { name:'신예원', dept:'영업팀',   rank:'과장', join:'2018.04.02', total:20, used:18, rate:90 },
    { name:'윤현우', dept:'기획팀',   rank:'선임', join:'2020.12.14', total:15, used:6,  rate:40 },
    { name:'장민서', dept:'인사팀',   rank:'사원', join:'2024.09.23', total:11, used:4,  rate:36 },
  ];

  function fillColor(rate) {
    if (rate >= 80) return 'var(--chart-1)';
    if (rate >= 60) return 'var(--chart-2)';
    return 'var(--chart-3)';
  }

  function renderTable(data) {
    const tbody = document.getElementById('employeeBody');
    tbody.innerHTML = data.map(e => `
      <tr data-dept="${e.dept}" data-rate="${e.rate}">
        <td class="text-left"><div class="table-avatar"><div class="avatar-circle">${e.name[0]}</div>${e.name}</div></td>
        <td><span class="badge badge-neutral">${e.dept}</span></td>
        <td>${e.rank}</td>
        <td class="text-secondary">${e.join}</td>
        <td><strong>${e.total}일</strong></td>
        <td>${e.used}일</td>
        <td><strong style="color:${e.total - e.used <= 3 ? 'var(--color-primary)' : 'var(--color-text-primary)'};">${e.total - e.used}일</strong></td>
        <td>
          <div class="progress-wrap">
            <div class="progress-track">
              <div class="progress-fill" style="width:${e.rate}%;background:${fillColor(e.rate)};"></div>
            </div>
            <span class="progress-label">${e.rate}%</span>
          </div>
        </td>
        <td>
          <button class="btn btn-secondary btn-sm" onclick='showDetail(${JSON.stringify(e)})'>상세</button>
        </td>
      </tr>
    `).join('');
  }

  function showDetail(e) {
    document.getElementById('modalName').textContent = e.name + ' 연차 상세';
    document.getElementById('mName').textContent = e.name;
    document.getElementById('mDept').textContent = e.dept + ' / ' + e.rank;
    document.getElementById('mJoin').textContent = e.join;
    document.getElementById('mTotal').textContent = e.total + '일';
    document.getElementById('mUsed').textContent = e.used + '일';
    document.getElementById('mRemain').textContent = (e.total - e.used) + '일';
    document.getElementById('mRate').textContent = e.rate + '%';
    openModal('detailModal');
  }

  renderTable(employees);

  /* 필터링 */
  function applyFilter() {
    const q = document.getElementById('searchInput').value.trim().toLowerCase();
    const dept = document.getElementById('deptFilter').value;
    const status = document.getElementById('statusFilter').value;

    const filtered = employees.filter(e => {
      const matchQ = !q || e.name.includes(q) || e.dept.includes(q);
      const matchDept = !dept || e.dept === dept;
      const matchStatus = !status ||
        (status === 'high' && e.rate >= 70) ||
        (status === 'low' && (e.total - e.used) <= 3);
      return matchQ && matchDept && matchStatus;
    });
    renderTable(filtered);
  }

  document.getElementById('searchInput').addEventListener('input', applyFilter);
  document.getElementById('deptFilter').addEventListener('change', applyFilter);
  document.getElementById('statusFilter').addEventListener('change', applyFilter);
</script>
</body>
</html>
